<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swap or Die - Jeu 3D Multijoueur</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="ui-overlay">
        <div id="auth-box">
            <h1>SWAP OR DIE</h1>
            <p id="guest-warning" style="color:#ffcc00; font-size:13px; display:none;">Attention : Compte invité. Suppression automatique dans 72h sans inscription !</p>
            <input type="text" id="username-input" placeholder="Ton pseudo..." maxlength="15">
            <input type="text" id="room-input" placeholder="Code de salon (ex: salon_1)" value="salon_1">
            <button onclick="joinGame(false)">Jouer en Invité</button>
            <button onclick="openAccountModal()" style="background:#333;">Créer un compte / Connexion</button>
        </div>
        <div id="game-hud" style="display: none;">
            <div id="hud-timer">Swap dans : 90s</div>
            <div id="hud-hp">PV : 100 / 100</div>
            <div id="hud-totem">Totems : 0</div>
            <div id="hud-controls-info">ZQSD / Flèches pour bouger - Espace pour sauter/piéger</div>
        </div>
    </div>

    <!-- Modale Easter Egg / Rickroll -->
    <div id="easter-egg-modal" style="display:none;">
        <div class="modal-card">
            <h2 id="ee-title">Événement Spécial</h2>
            <p id="ee-text">Message secret...</p>
            <div id="rickroll-container" style="display:none; margin-top:15px;">
                <iframe width="100%" height="200" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" frameborder="0" allow="autoplay"></iframe>
            </div>
            <button onclick="closeEasterEgg()" style="margin-top:15px;">Continuer</button>
        </div>
    </div>

    <script src="js/game.js"></script>
    <script src="js/client.js"></script>
</body>
</html>
